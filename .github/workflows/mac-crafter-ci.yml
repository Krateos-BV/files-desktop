name: mac-crafter CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Test mac-crafter
    timeout-minutes: 15
    # Mac Mini runners (all macOS CI on the Minis, 12 Nov 2026). XENIA_MACOS_RUNNER
    # holds the label list as JSON, e.g. ["self-hosted","xenia-mac-mini"]; deleting it
    # sends this job back to GitHub-hosted. Pull requests from forks stay hosted.
    runs-on: ${{ (vars.XENIA_MACOS_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.XENIA_MACOS_RUNNER) || 'macos-26' }}
    defaults:
      run:
        working-directory: admin/osx/mac-crafter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: swift test
