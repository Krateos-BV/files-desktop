#
# XNT-48: manual-dispatch CI for the Xenia Files rebrand (Krateos-BV fork).
# Unsigned build only — no code-signing step. Push trigger deferred until
# XNT-47 (Krateos-BV Actions minutes/billing check) resolves; re-add
# `on: push: branches: [master]` once that's confirmed.
name: Xenia Files CI (unsigned)

on:
  workflow_dispatch:

jobs:
  # XNT-168: the AppImage build container tag used to be pinned literally here
  # as well as in `.github/workflows/linux-appimage.yml`. Upstream bumps its own
  # tag whenever `admin/linux/build-appimage.sh` gains a build-time dependency
  # (XNT-154: openvfs needs libfuse at configure time, which only `-6` carries),
  # and an upstream sync updates linux-appimage.yml but never this file — so the
  # two drifted silently and the Linux job died at configure time inside a
  # third-party CMake file. The tag is now read out of linux-appimage.yml at run
  # time: it is defined exactly once, and follows every sync on its own.
  resolve-container:
    name: Resolve AppImage container tag
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Read the container pin from linux-appimage.yml
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=.github/workflows/linux-appimage.yml
          # That file has exactly one `container:` key. Fail loudly if it ever
          # gains, loses or moves one, rather than handing the build job an
          # empty image and failing somewhere far less legible.
          IMAGE=$(grep -oP '^\s*container:\s*\K\S+' "${SOURCE}" || true)
          COUNT=$(printf '%s' "${IMAGE}" | grep -c . || true)
          if [ "${COUNT}" != "1" ]; then
            echo "::error file=${SOURCE}::expected exactly one container: pin, found ${COUNT}. Adjust XNT-168's resolve-container job to match the new layout."
            exit 1
          fi
          echo "AppImage container: ${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

  linux-appimage:
    name: Linux AppImage (unsigned)
    needs: resolve-container
    runs-on: ubuntu-latest
    container: ${{ needs.resolve-container.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # XNT-139: GitHub rejects artifact names containing "/", so a branch like
      # fix/xnt-139-... fails the upload step even though the build succeeded.
      # There is no replace() in Actions expressions, so sanitise it in a step.
      - name: Sanitise ref name
        id: safe-ref
        # Explicit bash: inside the container the default shell resolves to
        # `sh -e`, and this substitution is a bashism.
        shell: bash
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          echo "Artifact-safe ref name: ${SAFE_REF}"
          echo "value=${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Configure, compile and package
        id: build-appimage
        env:
          APPNAME: "Xenia Files"
          APPICON_NAME: "Xenia Files"
          EXECUTABLE_NAME: xenia-files
          VERSION_SUFFIX: ${{ steps.safe-ref.outputs.value }}
        run: |
          # XNT-113: BUILD_UPDATER=OFF — Xenia has no update channel of its own, so the
          # shipped AppImage must not carry an updater (see NEXTCLOUD.cmake). This env var
          # is what build-appimage.sh turns into -DBUILD_UPDATER, and it overrides the
          # cmake default, so it has to be set here too.
          BUILDNR=${GITHUB_RUN_ID} BUILD_UPDATER=OFF DESKTOP_CLIENT_ROOT=`pwd` QT_BASE_DIR=/root/linux-gcc-x86_64 /bin/bash -c "./admin/linux/build-appimage.sh"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xenia-files-appimage-${{ steps.safe-ref.outputs.value }}-${{ github.sha }}
          path: ${{ steps.build-appimage.outputs.APPIMAGE_NAME }}
          overwrite: true
          compression-level: 0 # squashfs is already compressed

  windows-build:
    name: Windows build (unsigned)
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # XNT-139: same artifact-name sanitisation as the Linux job (see above).
      - name: Sanitise ref name
        id: safe-ref
        shell: pwsh
        run: |
          $safeRef = $env:GITHUB_REF_NAME -replace '/','-'
          echo "Artifact-safe ref name: $safeRef"
          echo "value=$safeRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Craft Master with Nextcloud Client Deps
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Install inkscape
        shell: pwsh
        run: |
          choco install inkscape

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --src-dir ${{ github.workspace }} nextcloud-client

      - name: Upload build output artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xenia-files-windows-build-${{ steps.safe-ref.outputs.value }}-${{ github.sha }}
          path: ${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\work\build\bin
          if-no-files-found: error
