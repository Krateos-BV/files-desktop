name: Linux Appimage Package
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.action != 'closed' && !github.event.pull_request.draft }}
    name: Linux Appimage Package
    runs-on: ubuntu-latest
    # XNT-168: this pin is the single source of truth for the AppImage build
    # container; xenia-ci.yml reads it from here instead of carrying its own
    # copy. Keep it on one line so that grep keeps finding it.
    container: ghcr.io/nextcloud/continuous-integration-client-appimage-qt6:client-appimage-el8-6.10.2-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Configure, compile and package
        id: build-appimage
        env:
          PR_ID: ${{ github.event.number }}
          # This fork's CMake (NEXTCLOUD.cmake) always installs under the
          # "Xenia Files" / xenia-files branding, not upstream's
          # "Nextcloud" / nextcloud — build-appimage.sh needs these to match
          # the actual installed paths (XNT-67).
          APPNAME: "Xenia Files"
          APPICON_NAME: "Xenia Files"
          EXECUTABLE_NAME: xenia-files
        run: |
            BUILDNR=${GITHUB_RUN_ID} VERSION_SUFFIX=${GITHUB_HEAD_REF} BUILD_UPDATER=ON DESKTOP_CLIENT_ROOT=`pwd` QT_BASE_DIR=/root/linux-gcc-x86_64 /bin/bash -c "./admin/linux/build-appimage.sh"

      - name: Upload AppImage artifact
        id: upload-appimage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextcloud-appimage-pr-${{ github.event.number }}
          path: ${{ steps.build-appimage.outputs.APPIMAGE_NAME }}
          overwrite: true
          compression-level: 0 # squashfs is already compressed
