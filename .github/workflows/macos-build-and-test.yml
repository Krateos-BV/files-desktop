name: macOS Build and Test

on:
  workflow_call:
    inputs:
      CRAFT_TARGET:
        type: string
        required: true
      CRAFT_MASTER_LOCATION:
        type: string
        required: true
      CRAFT_MASTER_CONFIG:
        type: string
        required: true
      PYTHON_VERSION:
        type: string
        required: true
      buildFileProviderModule:
        type: string
        required: true

jobs:
  build:
    name: Build nextcloud-client
    timeout-minutes: 60
    # Mac Mini runners (all macOS CI on the Minis, 12 Nov 2026). XENIA_MACOS_RUNNER
    # holds the label list as JSON, e.g. ["self-hosted","xenia-mac-mini"]; deleting it
    # sends this job back to GitHub-hosted. Pull requests from forks stay hosted.
    runs-on: ${{ (vars.XENIA_MACOS_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.XENIA_MACOS_RUNNER) || 'macos-26' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      
      - name: Show Swift version
        run: swift --version
      
      - name: Set up Python ${{ inputs.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}

      - name: Put Homebrew on PATH
        shell: bash
        run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            echo /opt/homebrew/bin >> "$GITHUB_PATH"
            echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          fi

      - name: Install Homebrew dependencies
        run: |
          brew install homebrew/cask/inkscape

      - name: Restore cached Craft directories
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.CRAFT_MASTER_LOCATION }}
            ${{ github.workspace }}/craft-clone
            ${{ github.workspace }}/${{ inputs.CRAFT_TARGET }}
          key: ${{ runner.os }}-${{ runner.environment }}-craft-${{ hashFiles(inputs.CRAFT_MASTER_CONFIG) }}

      - name: Build nextcloud-client
        run: |
          python "${{ inputs.CRAFT_MASTER_LOCATION }}/CraftMaster.py" --config "${{ inputs.CRAFT_MASTER_CONFIG }}" --target ${{ inputs.CRAFT_TARGET }} -c --options nextcloud-client.srcDir=${{ github.workspace }} --options nextcloud-client.buildFileProviderModule=${{ inputs.buildFileProviderModule }} nextcloud-client

      - name: Cache Craft directories containing the built client
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.CRAFT_MASTER_LOCATION }}
            ${{ github.workspace }}/craft-clone
            ${{ github.workspace }}/${{ inputs.CRAFT_TARGET }}
          key: ${{ runner.os }}-${{ runner.environment }}-craft-build-${{ github.sha }}-${{ inputs.buildFileProviderModule }}


  test:
    name: Run tests
    needs: build
    timeout-minutes: 60
    # Mac Mini runners (all macOS CI on the Minis, 12 Nov 2026). XENIA_MACOS_RUNNER
    # holds the label list as JSON, e.g. ["self-hosted","xenia-mac-mini"]; deleting it
    # sends this job back to GitHub-hosted. Pull requests from forks stay hosted.
    runs-on: ${{ (vars.XENIA_MACOS_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.XENIA_MACOS_RUNNER) || 'macos-26' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Restore cached Craft directories containing the built client
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.CRAFT_MASTER_LOCATION }}
            ${{ github.workspace }}/craft-clone
            ${{ github.workspace }}/${{ inputs.CRAFT_TARGET }}
          key: ${{ runner.os }}-${{ runner.environment }}-craft-build-${{ github.sha }}-${{ inputs.buildFileProviderModule }}

      - name: Run tests
        run: |
          cd ${{ github.workspace }}/${{ inputs.CRAFT_TARGET }}/build/nextcloud-client/work/build
          # PermissionsTest (test/testpermissions.cpp) is a known flake on macOS runners:
          # its read-only-fixture setup/teardown races, and it fails a different case each
          # time, on unrelated code (XNT-201). Run it separately with a bounded retry so a
          # transient "Permission denied" on the fixture doesn't block unrelated PRs, while
          # still failing the job if it is consistently red (which would indicate a real
          # regression rather than the known race).
          ctest --output-on-failure --output-junit testResult.xml -E '^PermissionsTest$'
          ctest --output-on-failure --output-junit testResult-permissions.xml -R '^PermissionsTest$' --repeat until-pass:3
