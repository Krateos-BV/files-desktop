name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * 1'   # Weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/nextcloud/desktop.git || true
          git fetch upstream master

      - name: Check drift
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Check for an existing open sync PR
        id: existing
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_pr=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("sync/upstream-"))][0].headRefName // ""')
          echo "pr=$open_pr" >> "$GITHUB_OUTPUT"

      - name: Attempt merge on sync branch
        if: steps.check.outputs.behind != '0' && steps.existing.outputs.pr == ''
        id: merge
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="sync/upstream-$DATE"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config user.name "xenia-sync-bot"
          git config user.email "bot@xeniacloud.eu"
          MERGE_OK=true
          git merge --no-commit --no-ff upstream/master || MERGE_OK=false

          # GITHUB_TOKEN can never push changes to .github/workflows/ - GitHub
          # hard-blocks it regardless of granted permissions (there is no valid
          # `permissions:` key for this; don't try adding one again), to stop a
          # workflow from self-modifying/escalating other workflows. Discard any
          # changes to that directory from the merge so the branch stays pushable,
          # in both the clean and conflicted cases.
          git checkout --no-overlay HEAD -- .github/workflows/ 2>/dev/null || true
          git add -A

          if [ "$MERGE_OK" = true ]; then
            git commit --no-edit
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            # Never silently drop a conflicted sync - commit it as-is with conflict
            # markers so the PR diff shows exactly what needs manual resolution,
            # per the fork/rebrand playbook (a merge --abort + failed run here is
            # invisible: issues are disabled on this repo, so nothing ever surfaced
            # it - this sat broken for weeks before anyone noticed).
            git commit -m "chore: merge nextcloud/desktop master (conflicts need manual resolution)"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
          git push origin "$BRANCH"

      - name: Open PR
        if: steps.check.outputs.behind != '0' && steps.existing.outputs.pr == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status_line="This merge was clean. Review before merging — theme/colored/* is a rebrand collision point even on clean merges."
          if [ "${{ steps.merge.outputs.status }}" == "conflict" ]; then
            status_line="**This merge has unresolved conflicts** (committed as-is with conflict markers) - resolve them on this branch before merging."
          fi
          # `gh pr create` drives GitHub's GraphQL createPullRequest mutation, which enforces a
          # stricter/buggier permission check than the equivalent REST endpoint for GITHUB_TOKEN
          # on forked repos — it 403s ("Resource not accessible by integration") even when the
          # REST call with the same token succeeds. Use REST directly instead (INF-225).
          gh api repos/${{ github.repository }}/pulls \
            -f title="Upstream sync: ${{ steps.merge.outputs.branch }}" \
            -f body="Automated merge of nextcloud/desktop:master (${{ steps.check.outputs.behind }} commits behind).

          $status_line" \
            -f base="${{ github.event.repository.default_branch }}" -f head="${{ steps.merge.outputs.branch }}"
