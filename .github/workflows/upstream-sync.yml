name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * 1'   # Weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Look up the sync PR and attempt the merge, but do not push or open a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Push and PR use a GitHub App installation token, as the other forks'
      # xenia-upstream-sync.yml do. A PR opened with GITHUB_TOKEN starts its
      # pull_request workflows only as `action_required` (waiting for "Approve and
      # run"), so the required conflict-markers check never reports on it. A PR
      # opened with an App installation token runs its checks.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App's client ID is an identifier, not a secret (read it with:
          # gh api /apps/xenia-upstream-sync --jq .client_id).
          client-id: Iv23li86RZXU8iKG6Dx1
          private-key: ${{ secrets.XENIA_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/nextcloud/desktop.git || true
          git fetch upstream master

      - name: Check drift
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Check for an existing open sync PR
        id: existing
        if: steps.check.outputs.behind != '0'
        # --repo is load-bearing: without it gh prefers the `upstream` remote and lists
        # nextcloud/desktop's PRs, so an open sync PR here was never seen and every Monday
        # opened a duplicate (PR #35 and #36 were open at the same time). (XEN-284)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName --jq '[.[] | select(.headRefName | startswith("sync/upstream-"))][0].headRefName // ""')
          echo "pr=$open_pr" >> "$GITHUB_OUTPUT"
          if [ -n "$open_pr" ]; then
            msg="Sync PR from $open_pr is still open in $GITHUB_REPOSITORY - not opening another. $BEHIND upstream commit(s) are pending; merge or close it and the next run picks them up."
            echo "::notice title=Upstream sync skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No open sync/upstream-* PR in $GITHUB_REPOSITORY."
          fi

      - name: Attempt merge on sync branch
        if: steps.check.outputs.behind != '0' && steps.existing.outputs.pr == ''
        id: merge
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="sync/upstream-$DATE"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          # The base tip, recorded before the merge moves HEAD, for the commit list below.
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config user.name "xenia-sync-bot"
          git config user.email "bot@xeniacloud.eu"
          MERGE_OK=true
          git merge --no-commit --no-ff upstream/master || MERGE_OK=false

          # Upstream's changes under .github/workflows/ are discarded, in the clean and
          # the conflicted case alike, so this fork's CI is not replaced by upstream's
          # (upstream jobs use runner labels such as ubuntu-latest-low that never run
          # here). The App token could push them; this is a choice, not a limitation.
          git checkout --no-overlay HEAD -- .github/workflows/ 2>/dev/null || true
          git add -A

          if [ "$MERGE_OK" = true ]; then
            git commit --no-edit
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            # Never silently drop a conflicted sync - commit it as-is with conflict
            # markers so the PR diff shows exactly what needs manual resolution,
            # per the fork/rebrand playbook (a merge --abort + failed run here is
            # invisible: issues are disabled on this repo, so nothing ever surfaced
            # it - this sat broken for weeks before anyone noticed).
            git commit -m "chore: merge nextcloud/desktop master (conflicts need manual resolution)"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            msg="DRY RUN: would push $BRANCH ($(git rev-parse --short HEAD), clean merge: $MERGE_OK) and open a PR against $BASE. Nothing was pushed."
            echo "::notice title=Upstream sync dry run::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          else
            # persist-credentials is off, so the push authenticates explicitly. A plain
            # push (no force): a same-day re-run finds the dated branch already there
            # and fails loudly instead of overwriting it.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          fi

      - name: Open PR
        if: steps.check.outputs.behind != '0' && steps.existing.outputs.pr == '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ steps.merge.outputs.base }}
          BEHIND: ${{ steps.check.outputs.behind }}
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
        run: |
          status_line="This merge was clean. Review before merging — theme/colored/* is a rebrand collision point even on clean merges."
          if [ "$MERGE_STATUS" == "conflict" ]; then
            status_line="**This merge has unresolved conflicts** (committed as-is with conflict markers) - resolve them on this branch before merging."
          fi

          # Commit list, capped so a large sync stays under GitHub's 65,536-character PR
          # body limit, and fenced so upstream @mentions and owner/repo#N references in
          # commit subjects neither notify anyone nor leave cross-references upstream.
          total=$(git rev-list --count "$BASE_SHA..upstream/master")
          log=$(git log --max-count=300 --format='- %h %s' "$BASE_SHA..upstream/master")
          if [ "$total" -gt 300 ]; then
            log="$log
          - ... and $((total - 300)) more (git log $BASE_SHA..upstream/master)"
          fi
          fence='````'

          body=$(cat <<EOF
          Automated merge of nextcloud/desktop:master ($BEHIND commits behind).

          $status_line

          Merge it with **Create a merge commit** - never squash or rebase. Either drops the upstream ancestry, and the same upstream commits then come back in the next sync (XEN-256).

          Upstream changes under .github/workflows/ are deliberately left out of this merge.

          ## Upstream commits

          ${fence}text
          $log
          ${fence}
          EOF
          )

          # `gh pr create` drives GitHub's GraphQL createPullRequest mutation, which refuses
          # tokens that the REST endpoint accepts ("Resource not accessible by
          # integration"), so the PR is created through REST.
          jq -n \
            --arg title "Upstream sync: $BRANCH" \
            --arg head "$BRANCH" \
            --arg base "$BASE" \
            --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}' \
          | gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" --input - \
              --jq '"Opened PR #\(.number): \(.html_url)"'
